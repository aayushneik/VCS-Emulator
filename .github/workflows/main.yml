name: Build VCS Emulator APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check engine library is in the repo
        run: |
          CORE=android-MAME4droid/app/src/main/jniLibs/arm64-v8a/libMAME4droid.so
          if [ ! -f "$CORE" ]; then
            echo "ERROR: $CORE nahi mili. Pehle libMAME4droid.so is path par upload karo."
            exit 1
          fi
          ls -l "$CORE"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK and NDK
        run: |
          sdkmanager --install "platforms;android-35"
          sdkmanager --install "build-tools;35.0.0"
          sdkmanager --install "ndk;28.2.13676358"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build VCS Emulator
        run: |
          gradle --no-daemon -p android-MAME4droid :app:assembleDebug --stacktrace

      - name: Verify engine is inside the APK
        run: |
          APK=$(ls android-MAME4droid/app/build/outputs/apk/debug/*.apk | head -n 1)
          echo "Checking $APK"
          unzip -l "$APK" | grep "lib/arm64-v8a/libMAME4droid.so" || {
            echo "ERROR: libMAME4droid.so APK ke andar nahi hai."
            exit 1
          }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VCS-Emulator-Debug-APK
          path: android-MAME4droid/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
